name: Publish to PyPI

  on:
    push:
      tags: ["v*"]
    workflow_dispatch:

  permissions:
    contents: read
    id-token: write

  jobs:
    publish:
      runs-on: ubuntu-latest
      environment: pypi

      steps:
        - uses: actions/checkout@v7

        - name: Install uv
          uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

        - name: Build distributions
          run: uv build --no-sources

        - name: Publish
          run: uv publish
