name: Publish container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  singularity:
    name: Build and push Apptainer/Singularity image
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2

      - name: Log in to GHCR
        run: |
          apptainer registry login \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            oras://ghcr.io

      - name: Build SIF from the published Docker image
        run: |
          apptainer build dichotomise.sif \
            docker://ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.version }}

      - name: Push SIF to GHCR
        run: |
          apptainer push dichotomise.sif \
            oras://ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.version }}-sif
