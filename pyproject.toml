[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dichotomise"
version = "0.1.0"
description = "Audit, sort, rectify, and archive DICOM exports from Siemens XA60+ systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DIChOtoMise contributors"}]
dependencies = [
    "pydicom>=3.0,<4",
    "click>=8.1,<9",
    "rich>=13,<15",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dichotomise = "dichotomise.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "SIM", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
