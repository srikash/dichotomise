[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dichotomise"
version = "2.1.0"
description = "Audit, sort, rectify, and archive DICOM exports from Siemens XA60+ systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "DIChOtoMise contributors"}]
keywords = ["DICOM", "medical-imaging", "Siemens", "anonymisation", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydicom>=3.0,<4",
    "click>=8.1,<9",
    "rich>=13,<15",
    "rich-click>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dichotomise = "dichotomise.cli:cli"

[project.urls]
Homepage = "https://github.com/srikash/dichotomise"
Repository = "https://github.com/srikash/dichotomise"
Issues = "https://github.com/srikash/dichotomise/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dichotomise.pydcm" = ["policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "SIM", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = "^tests/"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
